name: Bygg installasjonsfiler

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact-name: bassengfoto-windows
          - os: macos-latest
            script: build:mac
            artifact-name: bassengfoto-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publiser/oppdater "latest"-utgivelsen med installasjonsfilene
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Bassengfoto (siste bygg)
          body: |
            Automatisk bygg av Bassengfoto fra branch `${{ github.ref_name }}`.
            Last ned `.exe` (Windows) eller `.dmg` (Mac) under.
          make_latest: true
          files: installers/*
