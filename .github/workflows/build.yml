name: Bygg installasjonsfiler

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifact-name: bassengfoto-windows
          - os: macos-latest
            script: build:mac
            artifact-name: bassengfoto-mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error
