<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
<title>Bassengfoto — Visningsskjerm</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  #stage {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
  }

  #live-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  #overlay-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    z-index: 4;
  }
  #overlay-frame[hidden] { display: none; }

  #idle-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #666;
    font-size: 22px;
    text-align: center;
    padding: 0 10vw;
  }

  #captured-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.94);
    max-width: 88vw;
    max-height: 84vh;
    object-fit: contain;
    border-radius: 12px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    box-shadow: 0 0 0 6px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    background:
      linear-gradient(45deg, #1a1a1a 25%, transparent 25%),
      linear-gradient(-45deg, #1a1a1a 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #1a1a1a 75%),
      linear-gradient(-45deg, transparent 75%, #1a1a1a 75%);
    background-size: 40px 40px;
    background-position: 0 0, 0 20px, 20px -20px, -20px 0px;
    z-index: 3;
  }
  #captured-frame.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  #name-banner {
    position: absolute;
    bottom: 6vh;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: rgba(15, 143, 92, 0.92);
    color: #fff;
    font-size: clamp(22px, 3.4vw, 44px);
    font-weight: 700;
    padding: 14px 36px;
    border-radius: 999px;
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    white-space: nowrap;
    z-index: 5;
  }
  #name-banner.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  #live-label {
    position: absolute;
    top: 22px;
    left: 26px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    z-index: 5;
  }
  #live-label .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 8px #2ecc71;
  }

  #fullscreen-hint {
    position: absolute;
    bottom: 18px;
    right: 22px;
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="idle-msg">Venter på kameraforhåndsvisning fra Bassengfoto…</div>
    <canvas id="live-canvas" hidden></canvas>
    <img id="overlay-frame" hidden />
    <img id="captured-frame" />
    <div id="live-label"><span class="dot"></span> Live</div>
    <div id="name-banner"></div>
    <div id="fullscreen-hint">Dobbeltklikk for fullskjerm</div>
  </div>
  <script src="display.js"></script>
</body>
</html>
